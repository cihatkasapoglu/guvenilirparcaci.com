<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Araç Markaları | Güvenilir Parçacı</title><meta name="description" content="Araç markasına göre yedek parça ilanlarını ve modelleri keşfedin."><meta name="robots" content="index,follow"><link rel="canonical" href="https://guvenilirparcaci.com/marketplace/markalar.html"><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#182230;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between}.top a{color:#182230;text-decoration:none;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.brand{background:white;border:1px solid #e4e7ec;border-radius:11px;padding:17px;text-decoration:none;color:#182230;font-weight:800}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:14px}}</style></head><body><div class="wrap"><header class="top"><a href="/">Güvenilir Parçacı</a><a href="/marketplace/">← İlanlar</a></header><h1>Araç markaları</h1><p>Markanızı seçerek uyumlu yedek parça ilanlarına ulaşın.</p><div class="grid" id="grid">Markalar yükleniyor…</div></div><script type="module">import{createClient}from"https://esm.sh/@supabase/supabase-js@2";const sb=createClient("SUPABASE_PROJECT_URL_BURAYA","SUPABASE_ANON_KEY_BURAYA");const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function go(){const{data,error}=await sb.from("vehicle_brands").select("name,slug").eq("is_active",true).order("name");if(error)throw error;document.getElementById("grid").innerHTML=data.map(x=>'<a class="brand" href="/marketplace/marka.html?slug='+encodeURIComponent(x.slug)+'">'+esc(x.name)+' →</a>').join("");}go().catch(e=>document.getElementById("grid").textContent=e.message);</script></body></html>
