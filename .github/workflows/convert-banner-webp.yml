name: Convert homepage banner to WebP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Pillow
        run: python -m pip install Pillow

      - name: Convert banner
        run: |
          python - <<'PY'
          from PIL import Image
          image = Image.open("banner.PNG").convert("RGB")
          image.save("banner.webp", "WEBP", quality=95, method=6)
          print("Created banner.webp")
          PY

      - name: Commit WebP copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add banner.webp
          if git diff --cached --quiet; then
            echo "banner.webp is already up to date"
          else
            git commit -m "Add optimized WebP homepage banner"
            git push
          fi
