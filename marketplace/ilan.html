<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Yedek Parça İlanı | Güvenilir Parçacı</title><meta name="description" content="Yedek parça ilanı, ürün bilgileri ve satıcı iletişim bilgileri."><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#172033;font-family:Arial,system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;margin-bottom:20px}.logo{font-size:22px;font-weight:800;color:#172033;text-decoration:none}.muted,.small{color:#667085}.small{font-size:13px;line-height:1.7}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.8fr);gap:18px}.card{background:white;border:1px solid #e3e8ef;border-radius:14px;padding:18px;margin-bottom:16px}.hero{width:100%;height:390px;object-fit:contain;background:#f3f5f8;border-radius:10px}.thumbs{display:flex;gap:8px;overflow:auto;margin-top:10px}.thumbs img{width:80px;height:70px;object-fit:cover;border-radius:7px;border:2px solid transparent;cursor:pointer}.thumbs img.active{border-color:#b42318}h1{font-size:24px;line-height:1.3}.price{font-size:26px;font-weight:800;margin:14px 0}.spec{display:grid;grid-template-columns:1fr 1fr;gap:10px}.spec div{background:#f7f8fa;border-radius:8px;padding:10px}.spec b{display:block;font-size:12px;color:#667085;margin-bottom:4px}a.btn{display:block;text-align:center;text-decoration:none;padding:13px;border-radius:9px;background:#b42318;color:white;font-weight:800;margin-top:10px}a.whatsapp{background:#087443}.firmname{font-size:18px;font-weight:800}.desc{white-space:pre-wrap;line-height:1.7}.error{padding:30px;background:white;border-radius:12px;color:#b42318}@media(max-width:760px){.wrap{padding:13px}.layout{grid-template-columns:1fr}.hero{height:270px}h1{font-size:21px}}
</style></head><body><div class="wrap"><header class="head"><a class="logo" href="./">Güvenilir Parçacı</a><a href="./" class="small">← İlan aramaya dön</a></header><div id="content" class="muted">İlan yükleniyor…</div></div>
<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
const URL="SUPABASE_PROJECT_URL_BURAYA",KEY="SUPABASE_ANON_KEY_BURAYA",R2="R2_PUBLIC_BASE_URL_BURAYA";const sb=createClient(URL,KEY),$=id=>document.getElementById(id),id=new URLSearchParams(location.search).get("id");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const money=v=>v==null?"Fiyat sorunuz":new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY",maximumFractionDigits:2}).format(v);const url=k=>R2.includes("_BURAYA")?"":R2.replace(/\/$/,"")+"/"+k.split("/").map(encodeURIComponent).join("/");
async function load(){if(!id){$("content").innerHTML='<div class="error">İlan numarası bulunamadı.</div>';return;}const {data:l,error}=await sb.from("listings").select("*").eq("id",id).eq("status","published").gt("expires_at",new Date().toISOString()).maybeSingle();if(error||!l){$("content").innerHTML='<div class="error">Bu ilan bulunamadı veya yayından kaldırılmış.</div>';return;}
const [im,co,firm]=await Promise.all([sb.from("listing_images").select("id,r2_object_key,display_order,is_cover").eq("listing_id",id).order("display_order"),sb.from("listing_vehicle_compatibilities").select("vehicle_model_id,year_from,year_to").eq("listing_id",id),sb.from("public_firm_directory").select("*").eq("id",l.firm_id).maybeSingle()]);if(im.error||co.error||firm.error)throw im.error||co.error||firm.error;
const modelIds=co.data.map(x=>x.vehicle_model_id);let modelNames=[];if(modelIds.length){const {data:m}=await sb.from("vehicle_models").select("id,name,brand_id").in("id",modelIds);const brandIds=[...new Set((m||[]).map(x=>x.brand_id))];const {data:b}=await sb.from("vehicle_brands").select("id,name").in("id",brandIds);const bm=new Map((b||[]).map(x=>[x.id,x.name]));modelNames=(m||[]).map(x=>bm.get(x.brand_id)+" "+x.name);}
const photos=im.data||[],first=photos[0],phone=(firm.data?.phone||"").replace(/\D/g,""),wa=(firm.data?.whatsapp||firm.data?.phone||"").replace(/\D/g,"");
document.title=l.title+" | Güvenilir Parçacı";
$("content").innerHTML='<div class="layout"><main><section class="card">'+(first&&url(first.r2_object_key)?'<img id="hero" class="hero" src="'+esc(url(first.r2_object_key))+'" alt="'+esc(l.title)+'">':'<div class="hero" style="display:grid;place-items:center">Fotoğraf bulunmuyor</div>')+'<div class="thumbs">'+photos.map((p,i)=>'<img data-src="'+esc(url(p.r2_object_key))+'" class="'+(i===0?"active":"")+'" src="'+esc(url(p.r2_object_key))+'" alt="Ürün fotoğrafı '+(i+1)+'">').join("")+'</div></section><section class="card"><h2>Ürün açıklaması</h2><div class="desc">'+esc(l.description)+'</div></section><section class="card"><h2>Araç uyumluluğu</h2><p>'+modelNames.map(esc).join(", ")+'</p><p class="small">'+co.data.map(x=>(x.year_from||"")+" - "+(x.year_to||"")).join(" · ")+'</p></section></main><aside><section class="card"><span class="small">'+(l.part_type==="new"?"Sıfır parça":"Çıkma parça")+'</span><h1>'+esc(l.title)+'</h1><div class="price">'+money(l.price_try)+(l.price_type==="negotiable"&&l.price_try!=null?" · Pazarlık payı var":"")+'</div><div class="spec"><div><b>Kategori</b>'+esc(l.category_id)+'</div><div><b>Motor kodu</b>'+esc(l.engine_code||"Belirtilmemiş")+'</div><div><b>Yakıt</b>'+esc(l.fuel_type||"Belirtilmemiş")+'</div><div><b>OEM numarası</b>'+esc(l.oem_number||"Belirtilmemiş")+'</div><div><b>Konum</b>'+esc(l.province)+" / "+esc(l.district)+'</div><div><b>İlan tarihi</b>'+new Date(l.published_at).toLocaleDateString("tr-TR")+'</div></div><p class="small">İlan numarası: '+l.id+'</p></section><section class="card"><div class="firmname">'+esc(firm.data?.name||"Satıcı firması")+'</div><p class="small">'+esc(firm.data?.province||"")+' / '+esc(firm.data?.district||"")+'<br>'+esc(firm.data?.address||"")+'</p><p class="small">'+esc(firm.data?.description||"")+'</p>'+(phone?'<a class="btn" href="tel:'+phone+'">Telefonla ara</a>':'')+(wa?'<a class="btn whatsapp" target="_blank" rel="noopener" href="https://wa.me/'+wa+'">WhatsApp ile iletişim</a>':'')+'</section></aside></div>';
$("content").querySelector(".thumbs")?.addEventListener("click",e=>{const t=e.target.closest("img");if(!t||!t.dataset.src)return;const hero=$("hero");if(hero)hero.src=t.dataset.src;document.querySelectorAll(".thumbs img").forEach(x=>x.classList.toggle("active",x===t));});}
load().catch(e=>$("content").innerHTML='<div class="error">İlan bilgileri şu anda yüklenemiyor. Lütfen daha sonra tekrar deneyin.</div>');
</script></body></html>
