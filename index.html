<style>
.hero{background:#101820;padding:24px 0 28px;color:white}
.hero .container{max-width:1160px}
.hero-slider{position:relative;overflow:visible}
.slider-stage{position:relative;overflow:hidden}

.hero-slide{display:none;position:relative}
.hero-slide.is-active{display:block;animation:heroFade .35s ease}
.hero-banner{display:block;width:100%;height:auto;object-fit:contain}
.featured-label{position:absolute;right:18px;bottom:18px;background:#e7473f;color:#fff;font-size:13px;font-weight:850;letter-spacing:.7px;padding:12px 16px;border-radius:5px;box-shadow:0 4px 18px #0005}
.slider-arrows{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px;pointer-events:none}
.slider-arrows button{pointer-events:auto;border:1px solid #ffffff70;width:32px;height:32px;border-radius:50%;background:#14202b99;color:#fff;font-size:23px;line-height:1;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(4px)}
.slider-dots{position:relative;left:auto;bottom:auto;transform:none;display:flex;align-items:center;justify-content:center;gap:7px;margin:10px auto 0}
.slider-dots button{width:7px;height:7px;padding:0;border:1px solid #ffffffb5;border-radius:50%;background:#ffffff55;cursor:pointer}
.slider-dots button[aria-current="true"]{background:#fff;border-color:#fff;opacity:1;transform:scale(1.35)}
.slider-dots button[aria-current="false"]{opacity:.48}
.firm-banner-link{display:block;position:relative;min-height:300px;background:linear-gradient(120deg,#111b25,#263b4d 58%,#111820);overflow:hidden}
.firm-banner-fallback{min-height:300px;padding:45px 7%;display:none;flex-direction:column;align-items:flex-start;justify-content:center;color:white;gap:8px;background:radial-gradient(ellipse at 80% 50%,#e7473f44,transparent 45%)}
.firm-banner-fallback span{font-size:12px;font-weight:800;letter-spacing:2px;color:#ff8a82}
.firm-banner-fallback strong{font-size:clamp(30px,5vw,58px);letter-spacing:1px}
.firm-banner-fallback small{font-size:clamp(15px,2vw,21px);color:#d9e0e5}
.firm-banner-fallback em{font-size:13px;font-style:normal;font-weight:750;margin-top:12px;background:#e7473f;padding:10px 15px;border-radius:5px}
@keyframes heroFade{from{opacity:.55;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}
.mark-section{padding:58px 0 78px}
.mark-section h2{font-size:30px;letter-spacing:-1px;margin:0 0 8px}\n.home-seo-title{font-size:clamp(24px,3vw,32px);letter-spacing:-.8px;line-height:1.2;margin:0 0 9px;color:#101820}

<section class="hero"><div class="container">
<div class="hero-slider" id="heroSlider">
  <div class="slider-stage">
    <div class="hero-slide is-active" data-slide="0">
      <img class="hero-banner" src="/banner.PNG?v=1" alt="Türkiye’nin Güvenilir Yedek Parçacıları">
      <div class="featured-label">ÖNE ÇIKAN FİRMALAR</div>
    </div>
    <div class="hero-slide" data-slide="1">
      <a class="firm-banner-link" href="/firma/oto-bahtiyar" aria-label="Oto Bahtiyar firma profilini incele">
        <img class="hero-banner firm-banner-image" src="/oto-bahtiyar-banner.PNG" alt="Oto Bahtiyar öne çıkan firma bannerı" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="firm-banner-fallback"><span>ÖNE ÇIKAN FİRMA</span><strong>OTO BAHTİYAR</strong><small>Hyundai &amp; Kia Yedek Parça</small><em>Firma profilini incele&nbsp; ›</em></div>
      </a>
      <div class="featured-label">ÖNE ÇIKAN FİRMALAR</div>
    </div>
    <div class="slider-arrows"><button type="button" class="slide-prev" aria-label="Önceki banner">‹</button><button type="button" class="slide-next" aria-label="Sonraki banner">›</button></div>
  </div>
  <div class="slider-dots" id="sliderDots" aria-label="Banner sayfaları"></div>
</div>
</div></section>
<section class="mark-section"><div class="container"><h1 class="home-seo-title">Otomobil Markalarına Göre Yedek Parça Firmaları</h1><p class="lead">Aracınızın markasını seçin, ilgili yedek parça firmalarının profillerini ve iletişim bilgilerini inceleyin.</p><div class="brand-grid" id="homeBrands"></div></div></section>
<script>
(function(){
 const slides=Array.from(document.querySelectorAll("#heroSlider .hero-slide"));
 const dots=document.getElementById("sliderDots");
 let current=0;
 slides.forEach((slide,index)=>{const dot=document.createElement("button");dot.type="button";dot.setAttribute("aria-label",(index+1)+". banner");dot.addEventListener("click",()=>show(index));dots.appendChild(dot);});
 function show(next){slides[current].classList.remove("is-active");current=(next+slides.length)%slides.length;slides[current].classList.add("is-active");Array.from(dots.children).forEach((dot,index)=>dot.setAttribute("aria-current",index===current?"true":"false"));}
 document.querySelectorAll("#heroSlider .slide-next").forEach(button=>button.addEventListener("click",()=>show(current+1)));
 document.querySelectorAll("#heroSlider .slide-prev").forEach(button=>button.addEventListener("click",()=>show(current-1)));
 show(0);
 const slider=document.getElementById("heroSlider");
 let touchStartX=0,touchStartY=0;
 slider.addEventListener("touchstart",event=>{const t=event.changedTouches[0];touchStartX=t.clientX;touchStartY=t.clientY;},{passive:true});
 slider.addEventListener("touchend",event=>{
   const t=event.changedTouches[0],dx=t.clientX-touchStartX,dy=t.clientY-touchStartY;
   if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.25)show(current+(dx<0?1:-1));
 },{passive:true});
})();
</script>
</main>

root.innerHTML=(window.GP_BRANDS||[]).map(b=>'<a class="brand-card" href="/'+encodeURIComponent(b.id)+'-yedek-parca"><img src="'+b.logo+'" alt="'+b.name+' logosu" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'grid\'"><span class="logo-fallback" style="display:none">'+b.name.slice(0,2).toUpperCase()+'</span><strong>'+b.name+'</strong><span class="card-arrow">›</span></a>').join('');
</script>
