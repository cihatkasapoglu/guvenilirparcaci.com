<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f6f9"><link rel="preconnect" href="https://esm.sh" crossorigin><link rel="dns-prefetch" href="https://esm.sh"><link rel="canonical" href="https://guvenilirparcaci.com/marketplace/"><meta name="robots" content="index,follow"><title>Yedek Parça İlanları | Güvenilir Parçacı</title><meta name="description" content="Türkiye genelinde sıfır ve çıkma otomobil yedek parça ilanlarını arayın. Marka, model, kategori ve konuma göre filtreleyin."><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#172033;font-family:Arial,system-ui,sans-serif}.wrap{max-width:1200px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.logo{font-size:23px;font-weight:800;color:#172033;text-decoration:none}.muted{color:#667085}.panel{background:#fff;border:1px solid #e4e8ef;border-radius:14px;padding:18px;margin-bottom:18px}.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.filter-actions{display:flex;gap:8px}.item{position:relative}.featured{position:absolute;top:9px;left:9px;background:#b42318;color:#fff;border-radius:20px;padding:5px 8px;font-size:11px;font-weight:800}.pages{align-items:center;flex-wrap:wrap}.pages span{padding:8px;color:#667085}label{font-size:12px;font-weight:700;display:block;margin:0 0 6px}input,select{width:100%;padding:11px;border:1px solid #ccd3df;border-radius:8px;font:inherit;background:#fff}button{padding:11px 16px;border:0;border-radius:8px;background:#b42318;color:#fff;font-weight:700;cursor:pointer}.results-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.item{background:#fff;border:1px solid #e4e8ef;border-radius:12px;overflow:hidden;color:inherit;text-decoration:none;display:block}.item img{width:100%;height:170px;object-fit:cover;background:#eef1f5}.noimg{height:170px;display:grid;place-items:center;background:#eef1f5;color:#667085}.info{padding:13px}.title{font-weight:750;line-height:1.35;min-height:40px}.price{font-size:18px;font-weight:800;margin:9px 0;color:#172033}.small{font-size:12px;color:#667085;line-height:1.6}.pill{display:inline-block;border-radius:30px;background:#edf1f6;padding:4px 8px;font-size:11px;margin:0 4px 6px 0}.pages{display:flex;gap:8px;justify-content:center;margin:24px}.pages button{background:#e7ebf1;color:#172033}.pages button.active{background:#172033;color:#fff}#status{margin:10px 0}.empty{background:#fff;padding:30px;border-radius:12px;text-align:center;color:#667085}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}.filters{grid-template-columns:repeat(2,1fr)}}@media(max-width:580px){.wrap{padding:13px}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.item img,.noimg{height:125px}.info{padding:10px}.filters{grid-template-columns:1fr 1fr}.logo{font-size:19px}}
</style><style>.site-footer{max-width:1150px;margin:38px auto 0;padding:22px;border-top:1px solid #e4e7ec;color:#667085;font:13px Arial,system-ui,sans-serif;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}.site-footer nav{display:flex;gap:12px 16px;flex-wrap:wrap}.site-footer a{color:#667085;text-decoration:none}.site-footer a:hover{text-decoration:underline;color:#b42318}@media(max-width:600px){.site-footer{padding:18px 14px;display:block}.site-footer nav{margin-top:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><div class="wrap">
<header class="head"><a class="logo" href="/">Güvenilir Parçacı</a><nav style="display:flex;gap:14px;flex-wrap:wrap"><a href="/marketplace/favorilerim.html" style="color:#344054;text-decoration:none;font-weight:700">♡ Favorilerim</a><a href="/marketplace/markalar.html" style="color:#344054;text-decoration:none;font-weight:700">Markalar</a><a href="/marketplace/kategoriler.html" style="color:#344054;text-decoration:none;font-weight:700">Kategoriler</a></nav></header>
<section class="panel"><h1 style="font-size:22px;margin:0 0 16px">Yedek parça ilanlarını keşfedin</h1>
<div class="filters">
<div><label>Kelime / parça adı / motor kodu</label><input id="q" placeholder="Örn. D4FA motor"></div>
<div><label>Kategori</label><select id="category"><option value="">Tüm kategoriler</option></select></div>
<div><label>Parça türü</label><select id="part"><option value="">Sıfır ve çıkma</option><option value="new">Sıfır parça</option><option value="used">Çıkma parça</option></select></div>
<div><label>Marka</label><select id="brand"><option value="">Tüm markalar</option></select></div>
<div><label>Model</label><select id="model"><option value="">Tüm modeller</option></select></div>
<div><label>İl</label><input id="province" placeholder="Örn. Ankara"></div><div><label>İlçe</label><input id="district" placeholder="Örn. Ostim"></div><div><label>Yakıt türü</label><select id="fuel"><option value="">Tüm yakıt türleri</option><option value="Benzin">Benzin</option><option value="Dizel">Dizel</option><option value="LPG">LPG</option><option value="Hibrit">Hibrit</option><option value="Elektrik">Elektrik</option></select></div>
<div><label>En düşük fiyat (TL)</label><input id="min" type="number" min="0"></div>
<div><label>En yüksek fiyat (TL)</label><input id="max" type="number" min="0"></div>
<div><label>Sıralama</label><select id="sort"><option value="new">En yeni</option><option value="low">Fiyat artan</option><option value="high">Fiyat azalan</option></select></div>
<div class="filter-actions" style="align-self:end"><button id="search" style="flex:1">İlanları ara</button><button id="reset" type="button" style="background:#667085">Temizle</button></div>
</div></section>
<div class="results-head"><strong id="count">İlanlar</strong><span class="small">İlan sahipleriyle doğrudan iletişim kurun.</span></div><div id="status" class="muted"></div><section id="results" class="grid"></section><nav id="pages" class="pages"></nav>
</div>
<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
const URL="https://ugqsazhpfnqiqonhvkcb.supabase.co",KEY="sb_publishable_pfYeKe4n7HqXZBsuzb-1bA_4GFBwWlJ",R2="R2_PUBLIC_BASE_URL_BURAYA";
const sb=createClient(URL,KEY),$=id=>document.getElementById(id);let page=0,perPage=20,total=0;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=v=>v==null?"Fiyat sorunuz":new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY",maximumFractionDigits:0}).format(v);
const imgUrl=k=>!k?"":(k.startsWith("firms/")||k.startsWith("listings/"))?sb.storage.from("site-images").getPublicUrl(k).data.publicUrl:R2.includes("_BURAYA")?"":R2.replace(/\/$/,"")+"/"+k.split("/").map(encodeURIComponent).join("/");
async function catalog(){const [c,b]=await Promise.all([sb.from("categories").select("id,name").eq("is_active",true).order("sort_order"),sb.from("vehicle_brands").select("id,name").eq("is_active",true).order("name")]);if(c.error||b.error)throw c.error||b.error;$("category").innerHTML='<option value="">Tüm kategoriler</option>'+c.data.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("");$("brand").innerHTML='<option value="">Tüm markalar</option>'+b.data.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("");}
async function loadModels(){const id=$("brand").value;$("model").innerHTML='<option value="">Tüm modeller</option>';if(!id)return;const {data,error}=await sb.from("vehicle_models").select("id,name").eq("brand_id",id).eq("is_active",true).order("name");if(error)throw error;$("model").innerHTML='<option value="">Tüm modeller</option>'+data.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("");}
async function runSearch(){page=0;await results();}
async function results(){ $("status").textContent="İlanlar aranıyor…";let query=sb.from("listings").select("id,title,slug,description,price_try,price_type,part_type,province,district,engine_code,expires_at,published_at,category_id,firm_id",{count:"exact"}).eq("status","published").gt("expires_at",new Date().toISOString());
const q=$("q").value.trim().replace(/[,%_*()]/g," ").replace(/\s+/g," ");if(q)query=query.or("title.ilike.%"+q+"%,description.ilike.%"+q+"%,engine_code.ilike.%"+q+"%");
if($("category").value)query=query.eq("category_id",Number($("category").value));
if($("part").value)query=query.eq("part_type",$("part").value);
if($("province").value.trim())query=query.ilike("province","%"+$("province").value.trim().replace(/[,%()]/g," ")+"%");if($("district").value.trim())query=query.ilike("district","%"+$("district").value.trim().replace(/[,%()]/g," ")+"%");if($("fuel").value)query=query.ilike("fuel_type","%"+$("fuel").value+"%");
if($("min").value)query=query.gte("price_try",Number($("min").value));
if($("max").value)query=query.lte("price_try",Number($("max").value));
const modelId=$("model").value;if(modelId){const {data:co,error}=await sb.from("listing_vehicle_compatibilities").select("listing_id").eq("vehicle_model_id",Number(modelId));if(error)throw error;const ids=[...new Set((co||[]).map(x=>x.listing_id))];if(!ids.length){$("results").innerHTML='<div class="empty">Bu model için ilan bulunamadı.</div>';$("count").textContent="0 ilan";$("status").textContent="";$("pages").innerHTML="";return;}query=query.in("id",ids);}
const sort=$("sort").value;if(sort==="low")query=query.order("price_try",{ascending:true,nullsFirst:false});else if(sort==="high")query=query.order("price_try",{ascending:false,nullsFirst:false});else query=query.order("published_at",{ascending:false}).order("created_at",{ascending:false});
query=query.range(page*perPage,(page+1)*perPage-1);
const {data,error,count}=await query;if(error)throw error;total=count||0;
const now=new Date().toISOString();const {data:featuredRows,error:featuredError}=await sb.from("featured_listings").select("listing_id").eq("status","active").eq("payment_status","approved").lte("starts_at",now).gt("ends_at",now).in("listing_id",(data||[]).map(x=>x.id));if(featuredError)throw featuredError;const featuredIds=new Set((featuredRows||[]).map(x=>x.listing_id));data.sort((a,b)=>Number(featuredIds.has(b.id))-Number(featuredIds.has(a.id)));data.forEach(x=>x.is_featured=featuredIds.has(x.id));
if(!data?.length){$("results").innerHTML='<div class="empty">Aramanıza uygun ilan bulunamadı.</div>';$("count").textContent="0 ilan";$("status").textContent="";$("pages").innerHTML="";return;}
const ids=data.map(x=>x.id),firmIds=[...new Set(data.map(x=>x.firm_id))];
const [images,firms,compat]=await Promise.all([
sb.from("listing_images").select("listing_id,r2_object_key,display_order").in("listing_id",ids).order("display_order"),
sb.from("public_firm_directory").select("id,name,province,district").in("id",firmIds),
sb.from("listing_vehicle_compatibilities").select("listing_id,vehicle_model_id,year_from,year_to").in("listing_id",ids)
]);if(images.error||firms.error||compat.error)throw images.error||firms.error||compat.error;
const firmMap=new Map((firms.data||[]).map(x=>[x.id,x])),imageMap=new Map(),compatMap=new Map();
for(const x of images.data||[])if(!imageMap.has(x.listing_id))imageMap.set(x.listing_id,x.r2_object_key);
const modelIds=[...new Set((compat.data||[]).map(x=>x.vehicle_model_id))];let modelMap=new Map();if(modelIds.length){const {data:m,error:me}=await sb.from("vehicle_models").select("id,name,brand_id").in("id",modelIds);if(me)throw me;const brands=[...new Set(m.map(x=>x.brand_id))];const {data:b}=await sb.from("vehicle_brands").select("id,name").in("id",brands);const bm=new Map((b||[]).map(x=>[x.id,x.name]));modelMap=new Map(m.map(x=>[x.id,bm.get(x.brand_id)+" "+x.name]));}
for(const x of compat.data||[]){const a=compatMap.get(x.listing_id)||[];a.push(modelMap.get(x.vehicle_model_id));compatMap.set(x.listing_id,a);}
$("results").innerHTML=data.map(x=>{const f=firmMap.get(x.firm_id),key=imageMap.get(x.id),url=key&&imgUrl(key),models=(compatMap.get(x.id)||[]).filter(Boolean).slice(0,2).join(", ");return '<a class="item" href="ilan.html?id='+encodeURIComponent(x.id)+'">'+(url?'<img loading="lazy" decoding="async" width="320" height="180" src="'+esc(url)+'" alt="'+esc(x.title)+'">':'<div class="noimg">Fotoğraf yok</div>')+(x.is_featured?'<span class="featured">ÖNE ÇIKAN</span>':"")+'<div class="info"><div class="title">'+esc(x.title)+'</div><div class="price">'+money(x.price_try)+'</div><span class="pill">'+(x.part_type==="new"?"Sıfır parça":"Çıkma parça")+'</span><div class="small">'+esc(models)+'<br>'+esc(x.province)+(x.district?" / "+esc(x.district):"")+'<br>'+esc(f?.name||"Firma")+'</div></div></a>';}).join("");
$("count").textContent=total.toLocaleString("tr-TR")+" ilan";$("status").textContent="";const pages=Math.ceil(total/perPage);const start=Math.max(0,Math.min(page-3,pages-8));const end=Math.min(pages,start+8);$("pages").innerHTML=(page>0?'<button data-page="'+(page-1)+'">← Önceki</button>':"")+Array.from({length:end-start},(_,i)=>'<button class="'+(start+i===page?"active":"")+'" data-page="'+(start+i)+'">'+(start+i+1)+'</button>').join("")+(page<pages-1?'<button data-page="'+(page+1)+'">Sonraki →</button>':"");}
$("search").onclick=()=>runSearch().catch(e=>$("status").textContent=e.message);$("reset").onclick=()=>{["q","province","district","min","max"].forEach(id=>$(id).value="");["category","part","brand","model","fuel","sort"].forEach(id=>$(id).selectedIndex=0);runSearch().catch(e=>$("status").textContent=e.message);};$("brand").onchange=()=>loadModels().catch(e=>$("status").textContent=e.message);$("pages").onclick=e=>{const b=e.target.closest("[data-page]");if(!b)return;page=Number(b.dataset.page);results().catch(err=>$("status").textContent=err.message);};$("q").addEventListener("keydown",e=>{if(e.key==="Enter")runSearch().catch(err=>$("status").textContent=err.message);});
const initialQ=new URLSearchParams(location.search).get("q");if(initialQ)$("q").value=initialQ;catalog().then(results).catch(e=>$("status").textContent=e.message);
</script><footer class="site-footer"><div>© <span id="siteFooterYear"></span> Güvenilir Parçacı</div><nav aria-label="Kurumsal bağlantılar"><a href="/hakkimizda.html">Hakkımızda</a><a href="/iletisim.html">İletişim</a><a href="/uyelik-sozlesmesi.html">Üyelik Sözleşmesi</a><a href="/kvkk.html">KVKK</a><a href="/gizlilik.html">Gizlilik</a><a href="/cerez-politikasi.html">Çerez Politikası</a><a href="/ilan-kurallari.html">İlan Kuralları</a></nav></footer><script>document.getElementById("siteFooterYear").textContent=new Date().getFullYear();</script></body></html>
