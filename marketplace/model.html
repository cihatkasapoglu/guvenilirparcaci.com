arı</h1><p id="intro" class="small">Araç modelinize uyumlu yedek parçalar</p><div id="status" class="small">İlanlar yükleniyor…</div><div class="grid" id="grid"></div></div><script type="module">import{createClient}from"https://esm.sh/@supabase/supabase-js@2";const sb=createClient("https://ugqsazhpfnqiqonhvkcb.supabase.co","sb_publishable_pfYeKe4n7HqXZBsuzb-1bA_4GFBwWlJ"),R2="R2_PUBLIC_BASE_URL_BURAYA",params=new URLSearchParams(location.search),modelId=params.get("id"),slug=params.get("slug");const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const money=v=>v==null?"Fiyat sorunuz":new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY",maximumFractionDigits:0}).format(v);const img=k=>!k?"":(k.startsWith("firms/")||k.startsWith("listings/"))?sb.storage.from("site-images").getPublicUrl(k).data.publicUrl:R2.includes("_BURAYA")?"":R2.replace(/\/$/,"")+"/"+k.split("/").map(encodeURIComponent).join("/");async function go(){if(!modelId&&!slug)throw Error("Model bulunamadı.");let modelQuery=sb.from("vehicle_models").select("id,name,brand_id").eq("is_active",true);modelQuery=modelId?modelQuery.eq("id",modelId):modelQuery.eq("slug",slug);const{data:m,error:me}=await modelQuery.maybeSingle();if(me||!m)throw Error("Model bulunamadı.");const{data:b}=await sb.from("vehicle_brands").select("name").eq("id",m.brand_id).maybeSingle();const title=(b?.name||"")+" "+m.name;document.title=title+" Yedek Parça İlanları | Güvenilir Parçacı";const canonical="https://guvenilirparcaci.com/marketplace/model.html?id="+encodeURIComponent(m.id);document.querySelector("link[rel=canonical]").href=canonical;document.querySelector("meta[name=description]").content=title+" için sıfır ve çıkma yedek parça ilanları. Uyumlu motor, kaporta, mekanik ve diğer parçaları inceleyin.";document.getElementById("heading").textContent=title+" yedek parça ilanları";const{data:co,error:ce}=await sb.from("listing_vehicle_compatibilities").select("listing_id").eq("vehicle_model_id",m.id);if(ce)throw ce;const ids=[...new Set((co||[]).map(x=>x.listing_id))];if(!ids.length){document.getElementById("status").textContent="Bu modele uyumlu ilan bulunamadı.";return;}const{data,error}=await sb.from("listings").select("id,title,price_try,part_type,province,firm_id").in("id",ids).eq("status","published").gt("expires_at",new Date().toISOString()).order("published_at",{ascending:false}).limit(100);if(error)throw error;if(!data.length){document.getElementById("status").textContent="Bu modele uyumlu ilan bulunamadı.";return;}const lid=data.map(x=>x.id),fids=[...new Set(data.map(x=>x.firm_id))];const[ims,fs]=await Promise.all([sb.from("listing_images").select("listing_id,r2_object_key,display_order").in("listing_id",lid).order("display_order"),sb.from("public_firm_directory").select("id,name").in("id",fids)]);if(ims.error||fs.error)throw ims.error||fs.error;const pics=new Map();for(const x of ims.data||[])if(!pics.has(x.listing_id))pics.set(x.listing_id,x.r2_object_key);const fm=new Map((fs.data||[]).map(x=>[x.id,x.name]));document.getElementById("grid").innerHTML=data.map(x=>{const key=pics.get(x.id),src=key&&img(key);return'<a class="item" href="/marketplace/ilan.html?id='+x.id+'">'+(src?'<img loading="lazy" decoding="async" width="320" height="180" src="'+esc(src)+'" alt="'+esc(x.title)+'">':'<div class="noimg">Fotoğraf yok</div>')+'<div class="info"><b>'+esc(x.title)+'</b><div class="price">'+money(x.price_try)+'</div><div class="small">'+(x.part_type==="new"?"Sıfır parça":"Çıkma parça")+' · '+esc(x.province)+'<br>'+esc(fm.get(x.firm_id)||"")+'</div></div></a>';}).join("");document.getElementById("status").textContent=data.length+" ilan gösteriliyor (en fazla 100).";}go().catch(e=>document.getElementById("status").textContent=e.message);</script><footer class="site-footer"><div>© <span id="siteFooterYear"></span> Güvenilir Parçacı</div><nav aria-label="Kurumsal bağlantılar"><a href="/hakkimizda.html">Hakkımızda</a><a hr
