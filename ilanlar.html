<!doctype html>
<html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111820">
<title>Yedek Parça İlanları | GüvenilirParçacı</title>
<meta name="description" content="Türkiye genelinde sıfır, çıkma ve revizyonlu otomotiv yedek parça ilanlarını arayın. Araç markası, model, motor kodu ve OEM numarasına göre filtreleyin.">
<meta name="robots" content="index,follow,max-image-preview:large">
<link rel="canonical" href="https://guvenilirparcaci.com/ilanlar.html">
<link rel="stylesheet" href="site.css">
<style>
.market-wrap{max-width:1200px;margin:34px auto 75px;padding:0 18px;color:#18232c}
.market-intro{margin-bottom:22px}.market-intro h1{font-size:clamp(28px,4vw,38px);margin:0 0 8px}.muted{color:#66727d;font-size:13px;line-height:1.6}
.search-layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;align-items:start}
.filters,.results-panel{background:#fff;border:1px solid #e5e9ed;border-radius:14px;padding:18px}
.filters h2{font-size:18px;margin:0 0 14px}.field{margin:0 0 12px}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:5px}.field input,.field select{width:100%;min-height:40px;border:1px solid #d6dce1;border-radius:8px;padding:8px 10px;font:inherit;background:#fff}
.range{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.btn{border:0;border-radius:9px;padding:11px 14px;background:#202a33;color:#fff;font-weight:750;cursor:pointer}.btn.red{background:#df493f}.btn.light{background:#edf1f4;color:#26313a}
.results-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.results-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.product-card{border:1px solid #e5e9ed;border-radius:12px;overflow:hidden;background:#fff;min-width:0}
.product-card .photo{display:block;width:100%;height:175px;object-fit:cover;background:#f1f3f5}
.product-card .no-photo{height:175px;display:grid;place-items:center;background:#f1f3f5;color:#87919a;font-size:12px}
.product-copy{padding:12px}.product-copy h3{font-size:15px;line-height:1.35;margin:0 0 8px}.product-copy h3 a{color:#17232d;text-decoration:none}.product-copy p{font-size:12px;line-height:1.5;color:#65717a;margin:5px 0}
.price{font-size:16px;font-weight:850;color:#17232d;margin:8px 0}
.condition{display:inline-block;padding:4px 8px;border-radius:30px;background:#edf1f4;font-size:10px;font-weight:800}
.card-actions{display:flex;gap:7px;margin-top:10px}.card-actions a{flex:1;text-align:center;text-decoration:none;padding:8px 7px;border-radius:8px;background:#edf1f4;color:#24313a;font-size:11px;font-weight:800}.card-actions a.primary{background:#df493f;color:white}
.pagination{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:20px}.empty{padding:35px;text-align:center;color:#68747d}
.hidden{display:none!important}
@media(max-width:1000px){.results-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){.search-layout{grid-template-columns:1fr}.results-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.filters{padding:14px}}
@media(max-width:460px){.results-grid{grid-template-columns:1fr}.product-card .photo,.product-card .no-photo{height:200px}}
</style></head>
<body><div id="siteHeader"></div>
<main class="market-wrap">
<header class="market-intro"><h1>Yedek Parça İlanları</h1><p class="muted">Türkiye genelindeki sıfır, çıkma ve revizyonlu otomotiv parçalarını arayın. Ürün ve fiyat bilgisi için doğrudan ilan sahibi firmayla iletişime geçin.</p></header>
<div class="search-layout">
<aside class="filters"><h2>İlan ara ve filtrele</h2>
<form id="filterForm">
<div class="field"><label for="q">Ne arıyorsunuz?</label><input id="q" placeholder="Parça adı, motor kodu, OEM…"></div>
<div class="field"><label for="category">Kategori</label><select id="category"><option value="">Tüm kategoriler</option></select></div>
<div class="field"><label for="condition">Ürün durumu</label><select id="condition"><option value="">Tümü</option><option value="new">Sıfır</option><option value="used">Çıkma</option><option value="reconditioned">Revizyonlu</option></select></div>
<div class="field"><label for="brand">Araç markası</label><select id="brand"><option value="">Tüm markalar</option></select></div>
<div class="field"><label for="model">Araç modeli</label><input id="model" placeholder="Örn. Accent Era"></div>
<div class="field"><label for="city">Şehir</label><input id="city" placeholder="Örn. Ankara"></div>
<div class="field"><label for="engine">Motor kodu</label><input id="engine" placeholder="Örn. D4FA"></div>
<div class="field"><label for="oem">OEM kodu</label><input id="oem" placeholder="Parça referans numarası"></div>
<div class="field"><label>Fiyat aralığı (TL)</label><div class="range"><input id="minPrice" type="number" min="0" placeholder="En az"><input id="maxPrice" type="number" min="0" placeholder="En çok"></div></div>
<div class="actions"><button class="btn red" type="submit" style="width:100%">İlanları göster</button><button class="btn light" type="button" id="clearBtn" style="width:100%;margin-top:7px">Filtreleri temizle</button></div>
</form></aside>
<section class="results-panel">
<div class="results-head"><strong id="resultCount">İlanlar yükleniyor…</strong><span class="muted">Sayfa başına 24 ilan</span></div>
<div id="results" class="results-grid"><div class="empty">İlanlar yükleniyor…</div></div>
<div class="pagination"><button class="btn light" id="prevBtn" disabled>Önceki</button><span id="pageLabel" class="muted">1 / 1</span><button class="btn light" id="nextBtn" disabled>Sonraki</button></div>
</section></div></main>
<div id="siteFooter"></div>
<script src="shared.js"></script><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
const cfg=window.GP_SUPABASE_CONFIG,$=id=>document.getElementById(id);
if(!cfg||!window.supabase){$("results").innerHTML='<div class="empty">İlan arama bağlantısı kurulamadı.</div>';return;}
const db=window.supabase.createClient(cfg.url,cfg.anonKey);
let page=1,hasMore=false,loading=false;
const pageSize=24;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function filters(){return {
 p_query:$("q").value.trim()||null,p_category_id:$("category").value||null,p_condition:$("condition").value||null,
 p_vehicle_brand:$("brand").value||null,p_vehicle_model:$("model").value.trim()||null,p_city:$("city").value.trim()||null,
 p_engine_code:$("engine").value.trim()||null,p_oem_code:$("oem").value.trim()||null,
 p_min_price:$("minPrice").value?Number($("minPrice").value):null,p_max_price:$("maxPrice").value?Number($("maxPrice").value):null,
 p_page:page,p_page_size:pageSize
};}
async function lookups(){
 const [cats,brands]=await Promise.all([
  db.from("gp_categories").select("id,name,parent_id,sort_order").eq("is_active",true).order("sort_order"),
  db.from("gp_vehicle_brands").select("id,name").eq("is_active",true).order("sort_order")
 ]);
 if(cats.error||brands.error)throw cats.error||brands.error;
 const all=cats.data||[],roots=all.filter(x=>!x.parent_id);
 $("category").innerHTML='<option value="">Tüm kategoriler</option>'+roots.map(root=>'<optgroup label="'+esc(root.name)+'">'+all.filter(x=>x.parent_id===root.id).map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("")+'</optgroup>').join("");
 $("brand").innerHTML='<option value="">Tüm markalar</option>'+(brands.data||[]).map(x=>'<option value="'+esc(x.name)+'">'+esc(x.name)+'</option>').join("");
}
function priceText(x){if(x.price==null||x.price_type==="contact")return "Fiyat için iletişim";return Number(x.price).toLocaleString("tr-TR",{style:"currency",currency:x.currency||"TRY"});}
async function search(){
 if(loading)return;loading=true;$("results").innerHTML='<div class="empty">İlanlar aranıyor…</div>';
 try{
  const {data,error}=await db.rpc("gp_search_listings",filters());
  if(error)throw error;
  const rows=data||[];hasMore=Boolean(rows[0]?.has_more);
  $("resultCount").textContent=rows.length.toLocaleString("tr-TR")+" ilan gösteriliyor"+(hasMore?" · devamı var":"");
  const ids=rows.map(x=>x.id);let images=[];
  if(ids.length){const r=await db.from("gp_listing_images").select("listing_id,storage_path,is_cover,sort_order").in("listing_id",ids).order("sort_order");if(r.error)throw r.error;images=r.data||[];}
  const map={};images.forEach(x=>(map[x.listing_id]??=[]).push(x));
  $("results").innerHTML=rows.length?rows.map(x=>{
   const img=(map[x.id]||[]).find(y=>y.is_cover)||(map[x.id]||[])[0];
   const src=img?db.storage.from("gp-listing-images").getPublicUrl(img.storage_path).data.publicUrl:"";
   const cond=x.condition==="new"?"Sıfır":x.condition==="used"?"Çıkma":"Revizyonlu";
   const car=[x.vehicle_brand,x.vehicle_model,x.vehicle_year_from,x.vehicle_year_to].filter(Boolean).join(" ");
   const phone=(x.firm_phone||"").replace(/[^0-9+]/g,"");
   const whatsapp=(x.firm_whatsapp||"").replace(/\D/g,"");
   return '<article class="product-card">'+(src?'<img class="photo" src="'+esc(src)+'" alt="'+esc(x.title)+'" loading="lazy">':'<div class="no-photo">Fotoğraf eklenmemiş</div>')+'<div class="product-copy"><span class="condition">'+cond+'</span><h3><a href="/ilan.html?id='+encodeURIComponent(x.id)+'">'+esc(x.title)+'</a></h3><p>'+esc(car||x.category_name||"Otomotiv yedek parça")+'</p><p>'+esc([x.engine_code?"Motor: "+x.engine_code:"",x.oem_code?"OEM: "+x.oem_code:"",x.city||""].filter(Boolean).join(" · "))+'</p><div class="price">'+esc(priceText(x))+'</div><p>'+esc(x.firm_name||"Firma")+'</p><div class="card-actions"><a class="primary" href="/ilan.html?id='+encodeURIComponent(x.id)+'">İlanı incele</a>'+(phone?'<a href="tel:'+esc(phone)+'">Ara</a>':whatsapp?'<a target="_blank" rel="noopener" href="https://wa.me/'+esc(whatsapp)+'">WhatsApp</a>':'')+'</div></div></article>';
  }).join(""):'<div class="empty" style="grid-column:1/-1">Aramanızla eşleşen yayında ilan bulunamadı. Filtrelerinizi değiştirebilirsiniz.</div>';
  $("pageLabel").textContent="Sayfa "+page+ (hasMore?" · devamı var":" · son sayfa");$("prevBtn").disabled=page<=1;$("nextBtn").disabled=!hasMore;
 }catch(err){$("results").innerHTML='<div class="empty">İlanlar yüklenemedi: '+esc(err.message)+'</div>';$("resultCount").textContent="Arama yapılamadı";}
 finally{loading=false;}
}
$("filterForm").addEventListener("submit",e=>{e.preventDefault();page=1;search();});
$("clearBtn").addEventListener("click",()=>{$("filterForm").reset();page=1;search();});
$("prevBtn").addEventListener("click",()=>{if(page>1){page--;search();}});
$("nextBtn").addEventListener("click",()=>{if(hasMore){page++;search();}});
lookups().then(search).catch(e=>{$("results").innerHTML='<div class="empty">Filtreler yüklenemedi: '+esc(e.message)+'</div>';});
})();
</script></body></html>
