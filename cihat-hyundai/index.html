<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
const sb=createClient("https://ugqsazhpfnqiqonhvkcb.supabase.co","sb_publishable_pfYeKe4n7HqXZBsuzb-1bA_4GFBwWlJ"),R2="R2_PUBLIC_BASE_URL_BURAYA",requestedSlug=(location.pathname.replace(/^\/|\/$/g,"").startsWith("marketplace/")?new URLSearchParams(location.search).get("slug"):location.pathname.replace(/^\/|\/$/g,""))||new URLSearchParams(location.search).get("slug"),slug=requestedSlug==="cihat-hyundai"?"g-venilir-par-aci-test-firmasi":requestedSlug,$=id=>document.getElementById(id),PAGE_SIZE=12;
let firm=null,page=0,total=0;

async function loadListings(){const q=$("q").value.trim(),part=$("part").value,sort=$("sort").value;let query=sb.from("listings").select("id,title,price_try,price_type,part_type,province,district,published_at", {count:"exact"}).eq("firm_id",firm.id).eq("status","published").gt("expires_at",new Date().toISOString());if(q)query=query.ilike("title","%"+q.replace(/[,%()]/g," ")+"%");if(part)query=query.eq("part_type",part);if(sort==="price_asc")query=query.order("price_try",{ascending:true,nullsFirst:false}).order("published_at",{ascending:false});else if(sort==="price_desc")query=query.order("price_try",{ascending:false,nullsFirst:true}).order("published_at",{ascending:false});else query=query.order("published_at",{ascending:false});const from=page*PAGE_SIZE;const{data:list,error,count}=await query.range(from,from+PAGE_SIZE-1);if(error)throw error;total=count||0;const ids=(list||[]).map(x=>x.id);let pics=new Map();if(ids.length){const{data:images,error:ie}=await sb.from("listing_images").select("listing_id,r2_object_key,display_order").in("listing_id",ids).order("display_order");if(ie)throw ie;for(const x of images||[])if(!pics.has(x.listing_id))pics.set(x.listing_id,x.r2_object_key)}
$("resultCount").textContent=total+" ilan";$("listings").innerHTML=ids.length?list.map(x=>{const src=img(pics.get(x.id));return'<a class="item" href="/ilan/'+encodeURIComponent(x.id)+'/'+encodeURIComponent(x.title.toLocaleLowerCase("tr-TR").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ı/g,"i").replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ş/g,"s").replace(/ö/g,"o").replace(/ç/g,"c").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""))+'">'+(src?'<img loading="lazy" decoding="async" width="320" height="180" src="'+esc(src)+'" alt="'+esc(x.title)+'">':'<div class="noimg">Fotoğraf yok</div>')+'<div class="info"><b>'+esc(x.title)+'</b><div class="price">'+money(x.price_try,x.price_type)+'</div><span class="pill">'+(x.part_type==="new"?"Sıfır parça":"Çıkma parça")+'</span><div class="small">'+esc(x.province)+' / '+esc(x.district)+'</div></div></a>'}).join(""):'<div class="empty">Aramanızla eşleşen aktif ilan bulunamadı.</div>';

}

async function load(){if(!slug)throw Error("Firma mağazası adresi bulunamadı.");const{data:f,error}=await sb.from("public_firm_directory").select("id,name,slug,phone,whatsapp,province,district,address,description,logo_object_key,cover_object_key,created_at").eq("slug",slug).maybeSingle();if(error||!f)throw Error("Bu firma mağazası bulunamadı veya şu anda yayında değil.");firm=f;document.title=f.name+" | Yedek Parça İlanları - Güvenilir Parçacı";let desc=(f.name+" firmasının sıfır ve çıkma yedek parça ilanları. "+(f.province||"")+" "+(f.district||"")+" telefon ve WhatsApp iletişim bilgileri.").slice(0,155);let md=document.querySelector('meta[name="description"]');if(md)md.content=desc;
