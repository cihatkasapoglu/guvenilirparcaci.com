<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Firma Girişi ve Üyelik | GüvenilirParçacı</title><link rel="stylesheet" href="/site.css"><link rel="stylesheet" href="/platform.css"></head><body><div id="siteHeader"></div><main class="platform-wrap"><section class="platform-hero"><h1>Firma hesabınızı oluşturun</h1><p>Firmanızı kaydedin, onay sürecinden sonra yedek parça ilanlarınızı yayınlayın.</p></section><section class="platform-form"><div id="authMessage" class="platform-message">Mevcut hesabınızla giriş yapabilir veya yeni firma başvurusu oluşturabilirsiniz.</div><form id="authForm"><div class="platform-form-grid"><div class="platform-field full"><label>İşlem</label><select name="mode"><option value="signup">Yeni firma üyeliği</option><option value="login">Firma girişi</option></select></div><div class="platform-field full" data-signup><label>Firma adı</label><input name="company_name" required></div><div class="platform-field" data-signup><label>Telefon</label><input name="phone" required></div><div class="platform-field" data-signup><label>Şehir</label><input name="city" required></div><div class="platform-field full"><label>E-posta</label><input type="email" name="email" required autocomplete="email"></div><div class="platform-field full"><label>Şifre (en az 8 karakter)</label><input type="password" name="password" minlength="8" required autocomplete="new-password"></div></div><div class="platform-actions"><button class="platform-button" type="submit">Firma başvurusu oluştur</button></div></form></section></main><div id="siteFooter"></div><script src="/shared.js"></script><script src="/supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/platform.js"></script><script>const mode=document.querySelector('[name="mode"]'),fields=document.querySelectorAll('[data-signup]'),submit=document.querySelector('#authForm button');function toggle(){const signup=mode.value==='signup';fields.forEach(x=>{x.hidden=!signup;x.querySelectorAll('input').forEach(i=>i.required=signup)});submit.textContent=signup?'Firma başvurusu oluştur':'Giriş yap';}mode.addEventListener('change',toggle);toggle();</script></body></html>
