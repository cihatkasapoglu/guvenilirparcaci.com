<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101820">
<title>GüvenilirParçacı | Marka Bazlı Yedek Parça Firma Rehberi</title>
<meta name="description" content="Türkiye genelinde otomobil markalarına göre güvenilir yedek parça firmalarını keşfedin. Firma profilleri, iletişim ve işletme bilgileri.">
<link rel="canonical" href="https://guvenilirparcaci.com/"><link rel="icon" type="image/jpeg" href="/guvenilir-parcaci.jpg?v=logo3"><link rel="stylesheet" href="directory.css"><link rel="stylesheet" href="site.css?v=banner1">
<style>
.hero{background:#101820;padding:24px 0 28px;color:white}
.hero .container{max-width:1160px}
.hero-banner{display:block;width:100%;height:auto;object-fit:contain}
.mark-section{padding:58px 0 78px}
.mark-section h2{font-size:30px;letter-spacing:-1px;margin:0 0 8px}
.mark-section .lead{color:#66727d;margin:0 0 28px;font-size:14px}
.brand-grid{margin-top:0}
.brand-card{min-height:158px}
.brand-card img{height:76px}
.site-footer{margin-top:0}
@media(max-width:600px){.hero{padding:12px 0 18px}.mark-section{padding:38px 0 54px}.mark-section h2{font-size:24px}.brand-card{min-height:125px}.brand-card img{height:54px}}
</style>
</head>
<body>
<div id="siteHeader"></div>
<main>
<section class="hero"><div class="container"><img class="hero-banner" src="/banner.PNG?v=1" alt="Türkiye’nin Güvenilir Yedek Parçacıları"></div></section>
<section class="mark-section"><div class="container"><div class="kicker">Marka rehberi</div><h2>Otomobil markaları</h2><p class="lead">İlgilendiğiniz otomobil markasının logosuna veya adına tıklayarak firma rehberine geçin.</p><div class="brand-grid" id="homeBrands"></div></div></section>
</main>
<div id="siteFooter"></div>
<script src="brands.js"></script><script src="shared.js?v=logo3"></script><script src="supabase-config.js"></script><script src="visitor-counter.js"></script>
<script>
const root=document.getElementById('homeBrands');
root.innerHTML=(window.GP_BRANDS||[]).map(b=>'<a class="brand-card" href="marka.html?marka='+encodeURIComponent(b.id)+'"><img src="'+b.logo+'" alt="'+b.name+' logosu" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'grid\'"><span class="logo-fallback" style="display:none">'+b.name.slice(0,2).toUpperCase()+'</span><strong>'+b.name+'</strong><span class="card-arrow">›</span></a>').join('');
</script>
</body></html>
