<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Yedek Parça Firması | Güvenilir Parçacı</title><meta name="description" content="Güvenilir Parçacı firma mağazası. Firmanın aktif yedek parça ilanlarını ve iletişim bilgilerini görüntüleyin."><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#172033;font-family:Arial,system-ui,sans-serif}.wrap{max-width:1150px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;gap:12px;margin-bottom:18px}.head a{color:#172033;text-decoration:none;font-weight:800}.store{background:white;border:1px solid #e4e8ef;border-radius:15px;overflow:hidden;margin-bottom:22px}.cover{height:220px;background:#e9edf2;position:relative}.cover img{width:100%;height:100%;object-fit:cover}.profile{display:flex;gap:18px;align-items:flex-end;padding:0 22px 22px;margin-top:-48px;position:relative}.logo{width:112px;height:112px;flex:none;border-radius:14px;background:white;border:4px solid white;object-fit:contain;box-shadow:0 1px 5px #0002}.identity{padding-bottom:5px}.identity h1{margin:0 0 7px;font-size:26px}.muted{color:#667085}.small{font-size:13px;line-height:1.7;color:#667085}.body{padding:0 22px 22px}.body p{white-space:pre-wrap;line-height:1.65;margin:0 0 12px}.contacts{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.btn{display:inline-block;padding:11px 16px;border-radius:9px;background:#b42318;color:white;text-decoration:none;font-weight:800}.btn.wa{background:#087443}.address{font-size:13px;color:#667085}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0 13px}.bar h2{margin:0;font-size:22px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.item{background:white;border:1px solid #e4e8ef;border-radius:12px;overflow:hidden;color:inherit;text-decoration:none}.item img,.noimg{width:100%;height:165px;object-fit:cover;background:#eef1f5}.noimg{display:grid;place-items:center;color:#667085}.info{padding:13px}.info b{display:block;min-height:40px;line-height:1.4}.price{font-size:18px;font-weight:800;margin:8px 0}.pill{display:inline-block;background:#edf1f6;border-radius:20px;padding:4px 8px;font-size:11px}.error{background:white;padding:28px;border-radius:12px;color:#b42318}@media(max-width:850px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.wrap{padding:13px}.cover{height:150px}.profile{padding:0 13px 15px;gap:12px;margin-top:-35px}.logo{width:78px;height:78px;border-width:3px}.identity h1{font-size:20px}.body{padding:0 13px 16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.item img,.noimg{height:120px}.info{padding:10px}.bar h2{font-size:19px}}
</style></head><body><div class="wrap"><header class="head"><a href="/">Güvenilir Parçacı</a><a href="/marketplace/">← İlanlara dön</a></header><div id="content" class="muted">Firma mağazası yükleniyor…</div></div>
<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
const sb=createClient("SUPABASE_PROJECT_URL_BURAYA","SUPABASE_ANON_KEY_BURAYA"),R2="R2_PUBLIC_BASE_URL_BURAYA",slug=new URLSearchParams(location.search).get("slug"),$=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const money=v=>v==null?"Fiyat sorunuz":new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY",maximumFractionDigits:0}).format(v);const img=k=>R2.includes("_BURAYA")?"":R2.replace(/\/$/,"")+"/"+k.split("/").map(encodeURIComponent).join("/");
async function load(){if(!slug)throw Error("Firma mağazası adresi bulunamadı.");const{data:f,error:fe}=await sb.from("public_firm_directory").select("id,name,slug,phone,whatsapp,province,district,address,description,logo_object_key,cover_object_key,created_at").eq("slug",slug).maybeSingle();if(fe||!f)throw Error("Bu firma mağazası bulunamadı veya şu anda yayında değil.");document.title=f.name+" | Yedek Parça İlanları - Güvenilir Parçacı";const phone=(f.phone||"").replace(/\D/g,""),wa=(f.whatsapp||f.phone||"").replace(/\D/g,""),logo=f.logo_object_key&&img(f.logo_object_key),cover=f.cover_object_key&&img(f.cover_object_key);
const{data:list,error:le}=await sb.from("listings").select("id,title,price_try,price_type,part_type,province,district,published_at").eq("firm_id",f.id).eq("status","published").gt("expires_at",new Date().toISOString()).order("published_at",{ascending:false}).limit(100);if(le)throw le;const ids=(list||[]).map(x=>x.id);let pics=new Map();if(ids.length){const{data:images,error:ie}=await sb.from("listing_images").select("listing_id,r2_object_key,display_order").in("listing_id",ids).order("display_order");if(ie)throw ie;for(const x of images||[])if(!pics.has(x.listing_id))pics.set(x.listing_id,x.r2_object_key);}
$("content").innerHTML='<section class="store"><div class="cover">'+(cover?'<img src="'+esc(cover)+'" alt="'+esc(f.name)+' kapak fotoğrafı">':'')+'</div><div class="profile">'+(logo?'<img class="logo" src="'+esc(logo)+'" alt="'+esc(f.name)+' logo">':'<div class="logo" style="display:grid;place-items:center;color:#667085">Firma</div>')+'<div class="identity"><h1>'+esc(f.name)+'</h1><div class="small">'+esc(f.province)+' / '+esc(f.district)+'</div></div></div><div class="body">'+(f.description?'<p>'+esc(f.description)+'</p>':'')+'<div class="address">'+esc(f.address)+'</div><div class="small">Güvenilir Parçacı firma mağazası · '+new Date(f.created_at).toLocaleDateString("tr-TR")+' tarihinden beri</div><div class="contacts">'+(phone?'<a class="btn" href="tel:'+phone+'">Telefonla ara</a>':'')+(wa?'<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/'+wa+'">WhatsApp ile iletişim</a>':'')+'</div></div></section><div class="bar"><h2>Firmanın aktif ilanları</h2><span class="small">'+ids.length+' ilan</span></div><section class="grid" id="listings">'+(ids.length?list.map(x=>{const key=pics.get(x.id),src=key&&img(key);return'<a class="item" href="/marketplace/ilan.html?id='+x.id+'">'+(src?'<img loading="lazy" src="'+esc(src)+'" alt="'+esc(x.title)+'">':'<div class="noimg">Fotoğraf yok</div>')+'<div class="info"><b>'+esc(x.title)+'</b><div class="price">'+money(x.price_try)+'</div><span class="pill">'+(x.part_type==="new"?"Sıfır parça":"Çıkma parça")+'</span><div class="small">'+esc(x.province)+' / '+esc(x.district)+'</div></div></a>';}).join(""):'<div class="error">Bu firmanın şu anda yayında ilanı bulunmuyor.</div>')+'</section>';
}
load().catch(e=>$("content").innerHTML='<div class="error">'+esc(e.message||"Firma bilgileri şu anda yüklenemiyor.")+'</div>');
</script></body></html>
