<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Favorilerim | Güvenilir Parçacı</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#172033;font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between}.top a{color:#172033;text-decoration:none;font-weight:800}.card{background:white;border:1px solid #e3e8ef;border-radius:12px;padding:18px;margin:18px 0;max-width:440px}.field{display:grid;gap:6px;margin:12px 0}.field input{padding:11px;border:1px solid #cfd6e1;border-radius:8px}.btn{padding:11px 15px;background:#b42318;color:white;border:0;border-radius:8px;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.item{background:white;border:1px solid #e3e8ef;border-radius:12px;overflow:hidden;color:inherit;text-decoration:none}.item img,.noimg{width:100%;height:145px;object-fit:cover;background:#e9edf2}.noimg{display:grid;place-items:center;color:#667085}.info{padding:12px}.info b{display:block;min-height:38px}.price{font-size:18px;font-weight:800;margin:8px 0}.small{font-size:13px;color:#667085}#status{color:#667085;margin:12px 0}@media(max-width:720px){.wrap{padding:14px}.grid{grid-template-columns:repeat(2,1fr)}}</style><style>.site-footer{max-width:1150px;margin:38px auto 0;padding:22px;border-top:1px solid #e4e7ec;color:#667085;font:13px Arial,system-ui,sans-serif;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}.site-footer nav{display:flex;gap:12px 16px;flex-wrap:wrap}.site-footer a{color:#667085;text-decoration:none}.site-footer a:hover{text-decoration:underline;color:#b42318}@media(max-width:600px){.site-footer{padding:18px 14px;display:block}.site-footer nav{margin-top:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><div class="wrap"><header class="top"><a href="/">Güvenilir Parçacı</a><a href="/marketplace/">← İlanlara dön</a></header><h1>Favorilerim</h1><section class="card" id="auth"><p>Favori ilanlarınızı görmek için giriş yapın.</p><div class="field">E-posta<input id="email" type="email" autocomplete="email"></div><div class="field">Şifre<input id="password" type="password" autocomplete="current-password"></div><button class="btn" id="login">Giriş yap</button><button class="btn" id="signup" style="background:#344054">Üye ol</button><p id="authStatus" class="small"></p></section><div id="status"></div><div id="grid" class="grid"></div></div><script type="module">import{createClient}from"https://esm.sh/@supabase/supabase-js@2";const URL="SUPABASE_PROJECT_URL_BURAYA",KEY="SUPABASE_ANON_KEY_BURAYA",R2="R2_PUBLIC_BASE_URL_BURAYA",sb=createClient(URL,KEY),$=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const money=v=>v==null?"Fiyat sorunuz":new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY",maximumFractionDigits:0}).format(v);const img=k=>R2.includes("_BURAYA")?"":R2.replace(/\/$/,"")+"/"+k.split("/").map(encodeURIComponent).join("/");async function load(){const{data:{user}}=await sb.auth.getUser();$("auth").style.display=user?"none":"block";if(!user){$("status").textContent="Giriş yaptıktan sonra kayıtlı ilanlarınız burada listelenir.";return;}const{data:f,error:fe}=await sb.from("favorites").select("listing_id,created_at").eq("user_id",user.id).order("created_at",{ascending:false});if(fe)throw fe;if(!f.length){$("status").textContent="Henüz favori ilanınız yok.";return;}const ids=f.map(x=>x.listing_id);const{data:l,error:le}=await sb.from("listings").select("id,title,price_try,part_type,province").in("id",ids);if(le)throw le;const live=(l||[]).filter(x=>x);if(!live.length){$("status").textContent="Favorilerinizde şu anda görüntülenebilir ilan bulunmuyor.";return;}const{data:ims,error:ie}=await sb.from("listing_images").select("listing_id,r2_object_key,display_order").in("listing_id",live.map(x=>x.id)).order("display_order");if(ie)throw ie;const pics=new Map();for(const x of ims||[])if(!pics.has(x.listing_id))pics.set(x.listing_id,x.r2_object_key);$("grid").innerHTML=live.map(x=>{const k=pics.get(x.id),src=k&&img(k);return'<a class="item" href="/marketplace/ilan.html?id='+x.id+'">'+(src?'<img loading="lazy" src="'+esc(src)+'" alt="'+esc(x.title)+'">':'<div class="noimg">Fotoğraf yok</div>')+'<div class="info"><b>'+esc(x.title)+'</b><div class="price">'+money(x.price_try)+'</div><div class="small">'+(x.part_type==="new"?"Sıfır parça":"Çıkma parça")+' · '+esc(x.province)+'</div></div></a>';}).join("");$("status").textContent=live.length+" favori ilan";}async function login(){const{error}=await sb.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error)throw error;await load();} $("login").addEventListener("click",()=>login().catch(e=>$("authStatus").textContent=e.message));$("signup").addEventListener("click",async()=>{try{const{data,error}=await sb.auth.signUp({email:$("email").value,password:$("password").value});if(error)throw error;$("authStatus").textContent=data.session?"Üyelik oluşturuldu.":"E-posta adresinize doğrulama bağlantısı gönderildi.";if(data.session)await load();}catch(e){$("authStatus").textContent=e.message;}});load().catch(e=>$("status").textContent=e.message);</script><footer class="site-footer"><div>© <span id="siteFooterYear"></span> Güvenilir Parçacı</div><nav aria-label="Kurumsal bağlantılar"><a href="/hakkimizda.html">Hakkımızda</a><a href="/iletisim.html">İletişim</a><a href="/uyelik-sozlesmesi.html">Üyelik Sözleşmesi</a><a href="/kvkk.html">KVKK</a><a href="/gizlilik.html">Gizlilik</a><a href="/cerez-politikasi.html">Çerez Politikası</a><a href="/ilan-kurallari.html">İlan Kuralları</a></nav></footer><script>document.getElementById("siteFooterYear").textContent=new Date().getFullYear();</script></body></html>
